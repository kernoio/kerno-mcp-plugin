name: Check unified MCP drift

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-unified-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run drift script
        run: python scripts/check-unified-drift.py
